<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">From question to decision</title>
  <desc id="desc">Four connected steps: Question, Model, Evidence, Decision.</desc>
  <rect width="1200" height="260" rx="18" fill="#132631"/>
  <path d="M160 28V232 M460 28V232 M760 28V232 M1060 28V232" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
  <path d="M160 170 C310 170 310 86 460 86 S610 170 760 170 S910 86 1060 86" fill="none" stroke="#6dd0bf" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="170" r="12" fill="#132631" stroke="#79e2cf" stroke-width="4"/>
  <circle cx="460" cy="86" r="12" fill="#132631" stroke="#79e2cf" stroke-width="4"/>
  <circle cx="760" cy="170" r="12" fill="#132631" stroke="#79e2cf" stroke-width="4"/>
  <circle cx="1060" cy="86" r="13" fill="#a8e8bb"/>
  <text x="160" y="220" text-anchor="middle" fill="#e0eeee" font-family="Arial, Helvetica, sans-serif" font-size="20">Question</text>
  <text x="460" y="48" text-anchor="middle" fill="#e0eeee" font-family="Arial, Helvetica, sans-serif" font-size="20">Model</text>
  <text x="760" y="220" text-anchor="middle" fill="#e0eeee" font-family="Arial, Helvetica, sans-serif" font-size="20">Evidence</text>
  <text x="1060" y="48" text-anchor="middle" fill="#e0eeee" font-family="Arial, Helvetica, sans-serif" font-size="20">Decision</text>
</svg>
